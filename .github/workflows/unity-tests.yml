name: Unity Tests

# Mirrors Tools/unity-verify.ps1's intent so local and CI verification cannot drift:
# EditMode + PlayMode tests through the Unity test framework. GameCI's actions wrap the
# equivalent CLI invocation (batchmode, nographics, -runTests/-testPlatform/-testResults)
# plus licence activation, which the local script does not have to handle.
#
# REQUIRES A UNITY LICENCE SECRET. Without one every run fails at activation with
# "Missing Unity License File and no Serial was found", before a single test executes.
#   Personal: set UNITY_LICENSE to the contents of your .ulf file.
#             Activation steps: https://game.ci/docs/github/activation
#   Pro/Plus: set UNITY_SERIAL, UNITY_EMAIL and UNITY_PASSWORD instead.
# Add them under Settings -> Secrets and variables -> Actions.
#
# The detect-tests gate below exists so this workflow does not fail on a project that has
# no test suite; it routes those to a compile-only check. Assets/Tests now exists, so the
# real matrix is what runs.

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  UNITY_VERSION: 6000.3.8f1

jobs:
  # --- Gate: does a test suite exist yet? ------------------------------------
  detect-tests:
    name: Detect test assemblies
    runs-on: ubuntu-latest
    outputs:
      hasTests: ${{ steps.detect.outputs.hasTests }}
    steps:
      - name: Checkout (LFS not needed for this check)
        uses: actions/checkout@v4

      - id: detect
        name: Check whether Assets/Tests exists yet
        shell: bash
        run: |
          # A project with no test suite should still get a compile signal rather than a red
          # tick for tests that do not exist, so route those runs to the compile-only job.
          if [ -d "Assets/Tests" ] && find Assets/Tests -name '*.asmdef' -print -quit | grep -q .; then
            echo "hasTests=true" >> "$GITHUB_OUTPUT"
          else
            echo "hasTests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No test assemblies under Assets/Tests. Running a compile-only check instead of EditMode/PlayMode tests."
          fi

  # --- Test suite present: run it --------------------------------------------
  test:
    name: ${{ matrix.testMode }} tests
    needs: detect-tests
    if: needs.detect-tests.outputs.hasTests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.testMode }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.testMode }}-
            Library-${{ runner.os }}-

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          # Personal licences use UNITY_LICENSE (.ulf contents); Pro/Plus use UNITY_SERIAL
          # with the account email and password. Set whichever pair applies.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} test results

      # Guarded on the path being non-empty, not just on always(). When the test step fails
      # before producing results -- a missing licence is the usual cause -- artifactsPath is
      # empty and upload-artifact fails with "Input required and not supplied: path",
      # reporting a second, misleading error on top of the real one.
      - name: Upload test results
        if: always() && steps.tests.outputs.artifactsPath != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

  # --- No test suite: compile only --------------------------------------------
  compile-only:
    name: Compile check (no test suite yet)
    needs: detect-tests
    if: needs.detect-tests.outputs.hasTests == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-compile-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-compile-
            Library-${{ runner.os }}-

      # Runs an EditMode pass with zero test assemblies present. Unity's test runner does
      # not fail on an empty suite -- it still forces a full script compile, which is the
      # same signal `Tools\unity-verify.ps1 -Mode compile` gives locally (non-zero exit ==
      # scripts failed to compile). This job stops being selected the moment a test
      # assembly appears; the "test" job above takes over through the gate.
      - name: Compile check
        uses: game-ci/unity-test-runner@v4
        id: compile
        env:
          # Personal licences use UNITY_LICENSE (.ulf contents); Pro/Plus use UNITY_SERIAL
          # with the account email and password. Set whichever pair applies.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          checkName: Compile check
